<!doctype html>
<html lang="tr">
<head>

  <title>PixelOS — Retro Arcade</title><link rel="stylesheet" href="style.css">

  <main id="desktop"><div class="scanlines"></div><section id="icons"><button class="desktop-icon" data-app="arcade">🕹️<span>Oyun Merkezi</span></button><button class="desktop-icon" data-app="notepad">📝<span>Not Defteri</span></button><button class="desktop-icon" data-app="about">💾<span>Bilgisayarım</span></button></section><div id="windows"></div></main>

</html>
